openapi: 3.0.3
info:
  title: Leen Auth Service
  version: 1.0.0
  description: Auth, user profiles (customer/partner/staff/admin), and sub-admin RBAC.
servers:
  - url: /api
paths:
  /auth/signup:
    post:
      summary: Create a new account (customer/partner/staff/admin)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /auth/login:
    post:
      summary: Login with phone/email + password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /auth/otp/verify:
    post:
      summary: Verify an OTP code
      tags: [Auth]
      responses:
        '200': { description: OTP verified }
  /auth/token/refresh:
    post:
      summary: Exchange a refresh token for a new access token
      tags: [Auth]
      responses:
        '200': { description: Token refreshed }
  /auth/password/reset:
    post:
      summary: Reset password via OTP (mobile) or email link (admin)
      tags: [Auth]
      responses:
        '200': { description: Password reset }
  /profiles/me:
    get:
      summary: Get the authenticated user's role-specific profile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
    patch:
      summary: Update the authenticated user's profile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
  /profiles/partners/kyb:
    post:
      summary: Submit/resubmit partner KYB (business registration, SLA agreement, categories, coverage)
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Submitted for approval }
  /profiles/partners/{partnerId}/staff:
    get:
      summary: List a partner's staff roster
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Staff list }
    post:
      summary: Add a new staff member under this partner
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Staff created }
  /roles:
    get:
      summary: List RBAC roles (Finance/Operations/Support modules)
      tags: [RBAC]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Roles list }
    post:
      summary: Create a new sub-admin role with module permissions
      tags: [RBAC]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Role created }
  /roles/invite:
    post:
      summary: Invite a sub-admin with an assigned role
      tags: [RBAC]
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Invite sent }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      required: [phone, password, role]
      properties:
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        password: { type: string }
        role: { type: string, enum: [customer, partner, staff, admin, subadmin] }
    LoginRequest:
      type: object
      required: [password]
      properties:
        phone: { type: string }
        email: { type: string }
        password: { type: string }
        otp: { type: string }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/UserSummary' }
    UserSummary:
      type: object
      properties:
        id: { type: string }
        role: { type: string }
        status: { type: string }
    Profile:
      type: object
      description: Shape varies by role (CustomerProfile/PartnerProfile/StaffProfile/AdminProfile)
      additionalProperties: true
