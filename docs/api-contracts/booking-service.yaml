openapi: 3.0.3
info:
  title: Leen Booking Service
  version: 1.0.0
  description: Urgent/scheduled bookings, job execution lifecycle (OTP + photos), reviews.
servers:
  - url: /api/bookings
paths:
  /:
    post:
      summary: Create a booking (urgent or scheduled)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201': { description: Booking created, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
    get:
      summary: List bookings for the authenticated user (tabs Today/Active/History/Cancelled)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /{id}:
    get:
      summary: Get booking details
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /{id}/status:
    patch:
      summary: Transition booking status (en_route/arrived/in_progress/paused/completed)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated }
  /{id}/accept:
    post:
      summary: Partner accepts a broadcast job request
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Accepted }
  /{id}/assign-staff:
    post:
      summary: Partner assigns a staff member (tasker) to the job
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Assigned }
  /{id}/otp/verify:
    post:
      summary: Verify start/restart/end OTP for the job
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OTP verified }
  /{id}/photos:
    post:
      summary: Upload before/after job photo
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Photo uploaded }
  /{id}/cancel:
    post:
      summary: Cancel booking (applies cancellation fee/policy)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Cancelled }
  /{id}/reviews:
    post:
      summary: Submit a post-job review (star rating + tags)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Review submitted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CreateBookingRequest:
      type: object
      required: [serviceId, type, address]
      properties:
        serviceId: { type: string }
        type: { type: string, enum: [urgent, scheduled] }
        scheduledFor: { type: string, format: date-time }
        address:
          type: object
          properties: { formatted: { type: string }, lat: { type: number }, lng: { type: number } }
        notes: { type: string }
        toolsNeeded: { type: array, items: { type: string } }
        paymentMethod: { type: string }
    Booking:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [searching, confirmed, en_route, arrived, in_progress, paused, completed, cancelled] }
        type: { type: string, enum: [urgent, scheduled] }
