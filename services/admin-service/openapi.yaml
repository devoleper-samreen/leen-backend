openapi: 3.0.3
info:
  title: Leen Admin Service
  version: 1.0.0
  description: Admin dashboard overview, CMS banners, reports, audit log.
servers:
  - url: /api/admin
paths:
  /dashboard:
    get:
      summary: Dashboard widgets (orders, customers, partners, categories, new bookings/partners)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /banners:
    get:
      summary: List CMS banners
      tags: [CMS]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      summary: Create/update a banner (draft or publish)
      tags: [CMS]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /reports:
    get:
      summary: List generated reports
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      summary: Generate a report (date range + filters, export CSV/PDF)
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Report generation queued }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
