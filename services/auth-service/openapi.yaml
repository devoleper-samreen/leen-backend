components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      description: Customer signup only - partner/staff/admin accounts are created through other flows.
      required: [phone, password, fullName]
      properties:
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        password: { type: string }
        language: { type: string, enum: [en, ar] }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: 'Phone or email' }
        password: { type: string }
    SendOtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string }
        purpose: { type: string, enum: [login, signup, reset_password] }
    VerifyOtpRequest:
      type: object
      required: [phone, code, purpose]
      properties:
        phone: { type: string }
        code: { type: string }
        purpose: { type: string, enum: [login, signup, reset_password] }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ResetPasswordRequest:
      type: object
      required: [phone, code, newPassword]
      properties:
        phone: { type: string }
        code: { type: string }
        newPassword: { type: string }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    Profile:
      type: object
      description: Shape varies by role (CustomerProfile/PartnerProfile/StaffProfile/AdminProfile)
      additionalProperties: true
