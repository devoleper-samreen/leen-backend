openapi: 3.0.3
info:
  title: Leen Auth Service
  version: 1.0.0
  description: Auth, user profiles (customer/partner/staff/admin), and sub-admin RBAC.
servers:
  - url: /api
tags:
  - name: Auth
    description: 'auth-service: account creation, login, OTP and session/token management'
  - name: Profiles
    description: 'auth-service: authenticated user profile read/update'
paths:
  /auth/signup:
    post:
      summary: Create a new customer account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /auth/login:
    post:
      summary: Login with phone/email + password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /auth/otp/send:
    post:
      summary: Request an OTP code for signup, login or password reset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendOtpRequest' }
      responses:
        '200': { description: OTP sent }
  /auth/otp/verify:
    post:
      summary: Verify an OTP code (issues tokens when purpose is signup)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200': { description: OTP verified }
  /auth/token/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { description: Token refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /auth/logout:
    post:
      summary: Revoke a refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { description: Logged out }
  /auth/password/reset:
    post:
      summary: Reset password using an OTP sent to the account's phone
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
  /profiles/me:
    get:
      summary: Get the authenticated user's role-specific profile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
    patch:
      summary: Update the authenticated user's profile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
